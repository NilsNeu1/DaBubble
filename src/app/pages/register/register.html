<app-auth-card class="register-page" title="Konto erstellen" [showBackButton]="true" (back)="goBack()">
  <form [formGroup]="form" (ngSubmit)="submit()" class="register-form">
    <p class="register-form__hint">
      Mit deinem Namen und deiner E-Mail-Adresse hast du dein neues DABubble-Konto.
    </p>

    <app-text-field
      icon="person"
      placeholder="Name und Nachname"
      formControlName="name"
      [errorMessage]="nameError()"
    />

    <app-text-field
      icon="email"
      type="email"
      placeholder="beispielname@email.com"
      formControlName="email"
      [errorMessage]="emailError()"
    />

    <app-text-field
      icon="password"
      type="password"
      placeholder="Passwort"
      formControlName="password"
      [errorMessage]="passwordError()"
    />

    <label class="register-form__terms">
      <input type="checkbox" formControlName="acceptTerms" />
      <span>Ich stimme der <a routerLink="/privacy-policy">Datenschutzerklärung</a> zu.</span>
    </label>
    @if (formError()) {
      <p class="register-form__error">{{ formError() }}</p>
    }

    <div class="register-form__actions">
      <app-button variant="primary" type="submit" [disabled]="form.invalid || submitting()">
        Weiter
      </app-button>
    </div>
  </form>
</app-auth-card>
