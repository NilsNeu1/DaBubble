<app-header mode="legal" />

<main class="imprint-page">
    <section class="imprint-page__card" aria-labelledby="imprint-title">
        <button class="imprint-page__back-button" type="button" aria-label="Zur vorherigen Seite zurückkehren"
            (click)="goBack()">
            <img src="assets/back-arrow.png" alt="" />
        </button>

        <div class="imprint-page__content">
            <h1 id="imprint-title" class="imprint-page__title">
                Impressum
            </h1>

            <address class="imprint-page__address">
                <span>[Student Names List]</span>
                <span>
                    [Address of the DABubble operator – e.g. one of the
                    students]
                </span>
                <span>[Postcode and city]</span>
            </address>

            <section class="imprint-page__contact" aria-labelledby="imprint-contact-title">
                <h2 id="imprint-contact-title" class="imprint-page__contact-title">
                    Contact:
                </h2>

                <p class="imprint-page__email">
                    Email: [Deine E-Mail]
                </p>
            </section>
        </div>
    </section>

    <nav class="imprint-page__legal-links" aria-label="Rechtliche Informationen">
        <a class="imprint-page__legal-link" routerLink="/imprint">
            Impressum
        </a>

        <a class="imprint-page__legal-link" routerLink="/privacy-policy">
            Datenschutz
        </a>
    </nav>
</main>
