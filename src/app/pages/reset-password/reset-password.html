<app-auth-card
  class="reset-page"
  title="Passwort"
  titleLine2="zurücksetzen"
  [showBackButton]="true"
  (back)="goBack()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="reset-password">
    <app-text-field
      icon="none"
      type="password"
      [showPasswordToggle]="false"
      placeholder="Neues Passwort"
      formControlName="password"
      [errorMessage]="passwordError()"
    />

    <app-text-field
      icon="none"
      type="password"
      [showPasswordToggle]="false"
      placeholder="Neues Kennwort bestätigen"
      formControlName="confirmPassword"
      [errorMessage]="confirmPasswordError()"
    />

    @if (formError()) {
      <p class="reset-password__error">{{ formError() }}</p>
    }

    <div class="reset-password__actions">
      <app-button
        variant="primary"
        type="submit"
        [disabled]="form.invalid || submitting() || success()"
      >
        Passwort ändern
      </app-button>
    </div>
  </form>
</app-auth-card>

@if (success()) {
  <div class="reset-password__backdrop" aria-hidden="true"></div>
  <div class="reset-password__toast" role="status">Anmelden</div>
}
