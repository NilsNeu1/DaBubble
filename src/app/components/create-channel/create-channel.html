<section class="create-channel">
    <article class="overlay">
        <div class="overlay-header">
            <h1>Channel erstellen</h1><img src="assets/close.svg" alt="Close">
        </div>
        <span class="overlay-span">Channels dienen deinem Team zur Kommunikation. Am besten sollten sie themenbezogen
            sein #marketing zum Beispiel.</span>
        <article class="overlay-body">
            <div class="overlay-input">
                <label for="channel-name">Channel-Name</label>
                <input type="text" id="channel-name" name="channel-name" placeholder="#marketing">
            </div>
            <div class="overlay-input">
                <label for="channel-description">Beschreibung (optional)</label>
                <input type="text" id="channel-description" name="channel-description"
                    placeholder="Beschreibung des Channels">
            </div>
            <div><button>Erstellen</button></div>
        </article>
    </article>
</section>
