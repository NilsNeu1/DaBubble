<app-auth-card title="Passwort zurücksetzen" [showBackButton]="true" (back)="goBack()">
  @if (success()) {
    <p class="reset-password__success">
      Dein Passwort wurde geändert. Du wirst zur Anmeldung weitergeleitet …
    </p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="reset-password">
      <app-text-field
        icon="password"
        type="password"
        placeholder="Neues Passwort"
        formControlName="password"
        [errorMessage]="fieldError(form.controls.password)"
      />

      <app-text-field
        icon="password"
        type="password"
        placeholder="Neues Kennwort bestätigen"
        formControlName="confirmPassword"
        [errorMessage]="fieldError(form.controls.confirmPassword)"
      />

      @if (formError()) {
        <p class="reset-password__error">{{ formError() }}</p>
      }

      <div class="reset-password__actions">
        <app-button variant="primary" type="submit" [disabled]="submitting()">
          Passwort ändern
        </app-button>
      </div>
    </form>
  }
</app-auth-card>
