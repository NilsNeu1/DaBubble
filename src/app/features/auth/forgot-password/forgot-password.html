<app-auth-card title="Passwort zurücksetzen" [showBackButton]="true" (back)="goBack()">
  @if (emailSent()) {
    <p class="forgot-password__success">
      Wir haben dir eine E-Mail mit Anweisungen zum Zurücksetzen deines Passworts gesendet.
    </p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="forgot-password">
      <p class="forgot-password__hint">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

      <app-text-field
        icon="email"
        type="email"
        placeholder="beispielname@email.com"
        formControlName="email"
        [errorMessage]="fieldError(form.controls.email)"
      />

      <p class="forgot-password__hint">
        Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
      </p>

      @if (formError()) {
        <p class="forgot-password__error">{{ formError() }}</p>
      }

      <div class="forgot-password__actions">
        <app-button variant="primary" type="submit" [disabled]="submitting()">
          E-Mail senden
        </app-button>
      </div>
    </form>
  }
</app-auth-card>
