<app-auth-card
  class="forgot-page"
  title="Passwort"
  titleLine2="zurücksetzen"
  [showBackButton]="true"
  (back)="goBack()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="forgot-password">
      <p class="forgot-password__hint">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>

      <app-text-field
        icon="email"
        type="email"
        placeholder="beispielname@email.com"
        formControlName="email"
        [errorMessage]="emailError()"
      />

      <p class="forgot-password__hint">
        Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
      </p>

      @if (formError()) {
        <p class="forgot-password__error">{{ formError() }}</p>
      }

      <div class="forgot-password__actions">
        <app-button variant="primary" type="submit" [disabled]="form.invalid || submitting()">
          E-Mail senden
        </app-button>
      </div>
  </form>
</app-auth-card>

@if (emailSent()) {
  <div class="forgot-password__backdrop" aria-hidden="true"></div>
  <div class="forgot-password__toast" role="status">
    <span aria-hidden="true">➤</span>
    <span>E-Mail gesendet</span>
  </div>
}
